    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-10-18
    closed: 2026-10-11
    resolution: エージェントにはフォルダとAIポリシーの確認を行い、画像とPDF以外は返さない(ノートは /api/note で伏せ字付き)
    tests: [packages/server/test/security.test.ts]

  - id: GM-2026-003
    source: review
    title: blame / history がパスを正規化する前に確認し、別の書き方(/Private/a.md、a//b.md)で非公開のノートを読める。blame は伏せ字なし
    severity: high
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-10-18
    closed: 2026-10-11
    resolution: 正規化したパスで確認し、そのパスを使う。blame はエージェントに提供しない
    tests: [packages/server/test/security.test.ts]

  - id: GM-2026-004
    source: review
    title: エージェントが伏せ字の文字列を、規則に一致しない文脈(x[SECRET_…]x)に書き戻して読み直すと、元の値が見える
    severity: moderate
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-11-10
    closed: 2026-10-11
    resolution: 一度伏せた値は、文脈にかかわらずエージェントに渡すたびに伏せる
    tests: [packages/server/test/security.test.ts]

  - id: GM-2026-005
    source: review
    title: 伏せ字の文字列が値の32ビットのハッシュで、電話番号などは総当たりで元に戻せる
    severity: moderate
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-11-10
    closed: 2026-10-11
    resolution: 伏せ字はランダムな64ビットの値にする。古いハッシュ形式の伏せ字は今後使わない
    notes: すでにエージェントに渡した古い形式の伏せ字は、相手の手元に残っている(取り消せない)
    tests: [packages/server/test/security.test.ts]

  - id: GM-2026-006
    source: review
    title: カレンダーURLの取得で、名前解決・リダイレクト・IPv4射影IPv6を使うと内部アドレスに届く(SSRF、主に Node.js 版)
    severity: moderate
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-11-10
    closed: 2026-10-11
    resolution: >-
      リダイレクトを手動で追い、毎回確認する。Node.js では名前解決した全アドレスを確認する。
      IPv6 に埋め込まれた IPv4、マルチキャスト等も拒否。本文は2MBで読み込みを止める
    notes: 確認と実際の接続の間に DNS の応答が変わる攻撃(DNS rebinding)は残る。Node.js を社内ネットワークで動かす場合は、外向き通信をプロキシで制限する
    tests: [packages/server/test/security.test.ts]

  - id: GM-2026-007
    source: review
    title: OAuth で notes:capture を要求でき、エージェントのフォルダ制限を受けずに本人名義で書き込める
    severity: moderate
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-11-10
    closed: 2026-10-11
    resolution: OAuth では notes:capture を発行しない。capture でもトークンのフォルダ制限を適用し、フォルダ名を検証する
    tests: [packages/server/test/security.test.ts]

