  - id: GM-2026-011
    source: review
    title: Node.js 版で、接続元IPのヘッダー(x-forwarded-for など)を無条件に信用している。回数制限の回避と、ログのIP偽装ができる
    severity: low
    scope: production
    status: open
    found: 2026-10-11
    due: 2027-01-09
    notes: >-
      Cloudflare 版は cf-connecting-ip を Cloudflare が上書きするので影響なし。
      対応案:信頼するプロキシの設定(GMEMO_TRUST_PROXY)を追加し、未設定ならソケットのアドレスを使う

  - id: GM-2026-012
    source: review
    title: リフレッシュトークンの再利用を検出しても、同じ系列のトークンを失効させていない
    severity: low
    scope: production
    status: open
    found: 2026-10-11
    due: 2027-01-09
    notes: 再利用は失敗し記録される。盗まれたトークンが先に使われた場合に、正規のクライアント側で気づけるようにする

  - id: GM-2026-013
    source: review
    title: パスキーの認証でユーザー確認(PIN・生体認証)を必須にしていない
    severity: low
    scope: production
    status: accepted
    found: 2026-10-11
    due: 2027-01-09
    closed: 2026-10-11
    reason: >-
      スマートフォンやPCのパスキーは実際にはユーザー確認を行う。PINなしのセキュリティキーも使えるようにするため。
      端末を盗まれた場合は「すべての端末からサインアウト」とパスキーの削除で対応する
    review_by: 2027-04-11
