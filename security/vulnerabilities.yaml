# 脆弱性対応台帳
#
# 依存ライブラリの脆弱性(npm audit / Dependabot / GitHub Advisory)と、
# 実装起因の脆弱性(コードレビュー、テスト、外部からの報告)を1か所で管理する。
# 運用のルールは docs/secure-development.md。`npm run security:check` が CI で
# この台帳と実際の状態を突き合わせる(未登録の脆弱性、期限切れがあると失敗する)。
#
# 項目:
#   id        GHSA-xxxx(依存ライブラリ)または GM-YYYY-NNN(実装起因)
#   source    advisory | review | test | report | scan
#   package   依存ライブラリの場合のパッケージ名
#   severity  critical | high | moderate | low
#   scope     production(本番で動くコード)| build(ビルド・デプロイ時)| dev(開発・テストのみ)
#   status    open | fixed | not-affected | accepted
#   found     見つけた日 / due 対応期限 / closed 閉じた日
#   accepted の場合は reason と review_by(見直し期限)が必須

