  - id: GM-2026-001
    source: review
    title: 共有ブラウザで、前に使ったアカウントのノートの写しと未送信の変更が次のアカウントに見える・送られる
    severity: moderate
    scope: production
    status: fixed
    found: 2026-10-11
    due: 2026-11-10
    closed: 2026-10-11
    resolution: >-
      端末のデータ(Service Worker のキャッシュ、IndexedDB のキューと下書き)を、サインアウト時と
      別アカウントのサインイン時に消す。アカウントが端末を確認するまでキューを送らない(web/src/lib/localData.ts)
    tests: [packages/web/test/localData.test.ts]

  - id: GM-2026-002
