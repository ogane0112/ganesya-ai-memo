# Cloudflare Workers deployment. See docs/deploy-cloudflare.md.
name = "gmemo"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The built web app (npm run build -w @gmemo/web). API routes run the Worker first.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/oauth/*", "/.well-known/*", "/cal/*"]

# `npx wrangler d1 create gmemo` prints the database_id to paste here.
[[d1_databases]]
binding = "DB"
database_name = "gmemo"
database_id = "00000000-0000-0000-0000-000000000000"

# Daily cleanup of expired sessions, tokens and challenges.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Your public URL, e.g. https://gmemo.<account>.workers.dev or a custom domain.
GMEMO_ORIGIN = "http://localhost:8787"
# open | invite | closed
GMEMO_SIGNUP = "invite"
GMEMO_TIMEZONE = "Asia/Tokyo"
# Secrets (set with `npx wrangler secret put NAME`, never here):
#   GMEMO_SETUP_TOKEN  creates the first (admin) account
#   GMEMO_SECRET_KEY   encrypts users' GitHub tokens
