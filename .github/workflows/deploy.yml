name: Deploy

# main で CI が通ったら、ステージングへ自動でデプロイし、
# 本番は GitHub 上で承認されたときだけデプロイする(docs/deploy-cloudflare.md)。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手動で再デプロイするとき(Actions → Deploy → Run workflow、main のみ)
  workflow_dispatch:

permissions:
  contents: read
  actions: read # scripts/deploy.mjs が CI / CodeQL の結果を読む

# 同じ環境へのデプロイは1つずつ(途中で止めない)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    # main への push で動いた CI が成功したときだけ(PR やフォークからは動かない)
    if: >-
      github.repository == 'ogane0112/ganesya-ai-memo' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.GMEMO_STG_ORIGIN }}
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to staging
        run: node scripts/deploy.mjs staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GMEMO_STG_ORIGIN: ${{ vars.GMEMO_STG_ORIGIN }}
          GMEMO_ACCESS_TEAM_DOMAIN: ${{ vars.GMEMO_ACCESS_TEAM_DOMAIN }}
          GMEMO_STG_ACCESS_AUD: ${{ vars.GMEMO_STG_ACCESS_AUD }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Environment「production」に Required reviewers を設定しておくと、
    # ここで止まり、承認(Approve and deploy)されるまで実行されない。
    environment:
      name: production
      url: ${{ vars.GMEMO_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.staging.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to production
        # main の最新で、CI と CodeQL が成功したコミットだけ(scripts/deploy.mjs が確認する)
        run: node scripts/deploy.mjs production
        env:
          DEPLOY_BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GMEMO_ORIGIN: ${{ vars.GMEMO_ORIGIN }}
          GMEMO_ACCESS_TEAM_DOMAIN: ${{ vars.GMEMO_ACCESS_TEAM_DOMAIN }}
          GMEMO_ACCESS_AUD: ${{ vars.GMEMO_ACCESS_AUD }}
