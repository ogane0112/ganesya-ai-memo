name: Design catalog

# Publishes the component catalog (packages/web/design) to GitHub Pages, so
# anyone can look at the design without running the project. It is a static
# page built from sample data: no server, no account, nothing from a deployment.
on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/design-catalog.yml'
  workflow_dispatch:

# Least privilege for every job; the deploy job asks for what Pages needs.
permissions:
  contents: read

# One deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: design-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:design -w @gmemo/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/web/dist-design

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
